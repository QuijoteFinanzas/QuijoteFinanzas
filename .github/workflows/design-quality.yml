name: Revision visual Impeccable

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: impeccable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-review:
    name: Diseno y anti-patrones
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Revisar todas las fuentes con Impeccable
        continue-on-error: true
        run: npx --yes impeccable@3.5.0 detect --github .

      - name: Preparar comprobacion renderizada
        run: |
          npm install --prefix /tmp/qf-design --ignore-scripts --no-audit --no-fund playwright@1.64.1 impeccable@3.5.0
          /tmp/qf-design/node_modules/.bin/playwright install --with-deps chromium

      - name: PC y movil en claro y oscuro
        env:
          PLAYWRIGHT_MODULE: /tmp/qf-design/node_modules/playwright
          IMPECCABLE_BROWSER_SCRIPT: /tmp/qf-design/node_modules/impeccable/cli/engine/detect-antipatterns-browser.js
          DESIGN_REPORT_DIR: /tmp/qf-design-report
        run: node scripts/design-render-check.cjs

      - name: Guardar capturas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-four-views
          path: /tmp/qf-design-report
          retention-days: 7

      - name: Nota sobre el resultado
        if: always()
        run: echo "La revision de Impeccable es informativa. PRODUCT.md y DESIGN.md definen las decisiones deliberadas de QuijoteFinanzas."
