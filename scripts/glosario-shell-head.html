<style>
main{max-width:860px;margin:0 auto;padding:40px 24px 84px}
.crumbs{font-size:12px;color:#4f6175;margin-bottom:14px}.crumbs a{color:inherit;text-decoration:none}.crumbs a:hover{color:var(--navy)}
.section-kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#7a5f14;font-weight:700;margin-bottom:8px}
h1{font-family:'Playfair Display',serif;font-size:clamp(26px,3.4vw,34px);font-weight:600;letter-spacing:-.015em;color:var(--navy);line-height:1.18}
.lead{font-size:15px;color:#3f5266;margin-top:10px;max-width:680px;line-height:1.65}
.divider{width:40px;height:2px;background:var(--gold);margin:16px 0 26px;border-radius:1px;opacity:.7}
h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:600;color:var(--navy);margin:30px 0 12px}
.term ul{padding-left:20px;line-height:1.7;font-size:15px;color:#2d4a6b}.term li{margin-bottom:6px}
.term p{font-size:15px;line-height:1.7;color:#2d4a6b}
.example{background:var(--surface-soft);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:10px;padding:4px 18px 14px;margin-top:26px}
.example h2{margin-top:14px}.example p{margin-bottom:8px}.term .ex-note{font-size:12px;color:#5c6f83}
.faq{border-top:1px solid var(--border);padding:12px 0}.faq:last-of-type{border-bottom:1px solid var(--border)}
.faq summary{cursor:pointer;font-weight:600;color:var(--navy);font-size:15px;list-style-position:outside}
.faq p{margin-top:8px}
.notice{font-size:12px;color:#5c6f83;line-height:1.6;margin-top:24px}.term .notice{font-size:12px;color:#5c6f83}
.notice a{color:inherit}
.cta{margin-top:36px;background:#0f2035;color:#fff;border-radius:14px;padding:22px}
.cta h2{color:#fff;font-size:20px;margin:0 0 4px}.cta p{font-size:13px;color:#d1dae6}
.nl{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nl input{flex:1;border:0;border-radius:8px;padding:10px 12px;font:14px 'DM Sans',sans-serif;min-width:200px}
.nl button{background:var(--gold);color:#0f2035;border:0;font-weight:700;font-size:13px;padding:10px 16px;border-radius:8px;cursor:pointer}
.nl-msg{font-size:12px;color:#d1dae6;width:100%}
.related{display:flex;flex-wrap:wrap;gap:8px;font-size:13px}
.related a{color:var(--navy2);border:1px solid var(--border);border-radius:999px;padding:8px 12px;text-decoration:none;min-height:24px}
.related a:hover{border-color:var(--gold)}
.az{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.az a{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border:1px solid var(--border);border-radius:8px;color:var(--navy);text-decoration:none;font-weight:600;font-size:14px}
.g-letter{scroll-margin-top:90px}.g-letter ul{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.g-item{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--surface)}
.g-item h3{font-size:15px;color:var(--navy);margin-bottom:4px}.g-item h3 a{color:inherit;text-decoration:underline;text-decoration-color:var(--gold);text-underline-offset:3px}
.g-item p{font-size:13px;line-height:1.55;color:#3f5266}.g-item.has-page{border-left:3px solid var(--gold)}
html[data-theme="dark"] h1,html[data-theme="dark"] h2,html[data-theme="dark"] .faq summary,html[data-theme="dark"] .g-item h3,html[data-theme="dark"] .az a{color:#edf3f8}
html[data-theme="dark"] .lead,html[data-theme="dark"] .term p,html[data-theme="dark"] .term ul,html[data-theme="dark"] .g-item p,html[data-theme="dark"] .notice,html[data-theme="dark"] .term .notice,html[data-theme="dark"] .term .ex-note{color:#b9c9d8}
html[data-theme="dark"] .section-kicker{color:#d7b85d}
html[data-theme="dark"] .crumbs{color:#b9c9d8}
html[data-theme="dark"] .example,html[data-theme="dark"] .g-item,html[data-theme="dark"] .cta{background:#182638;border-color:#33485e}
html[data-theme="dark"] .example{border-left-color:var(--gold)}
html[data-theme="dark"] .faq,html[data-theme="dark"] .az a{border-color:#2d4255}
html[data-theme="dark"] .related a{color:#cbd8e4;border-color:#33485e}
@media(max-width:699px){main{padding:26px 14px 70px}}
</style>
